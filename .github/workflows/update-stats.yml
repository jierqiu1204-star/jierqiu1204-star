name: Update GitHub Stats

on:
  schedule:
    # 09:17 Asia/Shanghai, daily.
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

concurrency:
  group: github-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=jierqiu1204-star&custom_title=GitHub+Stats&theme=github_dark&title_color=00C2FF&text_color=5E92C8&icon_color=00C2FF&ring_color=4F8CC9&hide_border=true&locale=en&border_radius=8&card_width=520&rank_icon=default&show_icons=true&include_all_commits=true&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Validate generated card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          svg = Path("profile/stats.svg").read_text()
          root = ET.fromstring(svg)
          assert root.tag == "{http://www.w3.org/2000/svg}svg"
          assert float(root.attrib["width"]) == 520
          assert float(root.attrib["height"]) == 195
          text = " ".join(root.itertext())
          assert "GitHub Stats" in text and "Total Commits" in text
          assert "Something went wrong" not in text
          for color in ("#00c2ff", "#5e92c8", "#4f8cc9", "#0d1117"):
              assert color in svg.lower(), f"Missing theme color: {color}"
          PY

      - name: Commit updated card
        run: |
          git add profile/stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update GitHub Stats"
          git push origin "HEAD:$GITHUB_REF_NAME"
